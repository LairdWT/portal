name: Verify

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
            - name: Install pnpm
              uses: pnpm/action-setup@v4
            - name: Set up Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            # `pnpm verify` runs the jsdom `unit` project (`pnpm test:run`) and
            # then the `storybook` project (`pnpm test:stories`, the axe a11y
            # gate). The storybook project uses @vitest/browser-playwright (real
            # Chromium), so the browser must be installed before verify runs.
            - name: Install Playwright Chromium
              run: pnpm exec playwright install --with-deps chromium
            - name: Run verify
              run: pnpm verify
            # Coverage is gated in CI only (thresholds in vitest.config.ts), kept
            # out of the fast inner-loop `verify` so local iteration stays quick.
            - name: Coverage gate
              run: pnpm test:coverage
